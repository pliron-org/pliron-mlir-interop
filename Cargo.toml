[package]
name = "pliron-mlir-interop"
description = "IR translation between pliron and MLIR"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/pliron-org/pliron-mlir-interop"
categories = ["compilers"]
keywords = ["pliron", "mlir", "interop", "compiler"]

[dependencies]
pliron = { git = "https://github.com/pliron-org/pliron.git" }
pliron-llvm = { git = "https://github.com/pliron-org/pliron.git", default-features = false, std = true }
thiserror = "2"
log = { version = "0" }

[dev-dependencies]
expect-test = "1"
env_logger = "0"
